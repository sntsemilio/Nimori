[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nimori-lab"
version = "0.1.0.dev1"
description = "Nimori: pequeños modelos, grandes preguntas. Laboratorio educativo de IA en terminal."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
nimori = "nimori.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nimori = ["data/*.json"]
